<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Abrir Puerta — MG Fitness</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --txt:#e6edf3;
    --accent:#2ea043; --accent2:#3fb950; --danger:#f85149; --muted:#8b949e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:24px; min-height:100dvh;
    /* Bloquea selección de texto y menú contextual del "mantener presionado" en el celu */
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation;
  }
  h1{ font-size:20px; font-weight:600; margin:0; text-align:center; color:var(--txt); }
  .sub{ color:var(--muted); font-size:13px; margin-top:-16px; text-align:center; }

  .btn{
    position:relative; width:230px; height:230px; border-radius:50%;
    background:var(--panel); border:3px solid #30363d; overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .08s ease, border-color .2s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{ transform:scale(.97); }
  .btn.holding{ border-color:var(--accent2); }
  .btn.done{ border-color:var(--accent2); background:#132a17; }
  .btn.error{ border-color:var(--danger); background:#2a1416; }

  /* Relleno de progreso que sube desde abajo durante el hold */
  .fill{
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    transition:height .05s linear; z-index:1;
  }
  .label{ position:relative; z-index:2; text-align:center; pointer-events:none; }
  .label .icon{ font-size:52px; line-height:1; }
  .label .text{ display:block; margin-top:8px; font-size:15px; font-weight:600; }

  #status{ font-size:14px; min-height:20px; text-align:center; color:var(--muted); }
  #status.ok{ color:var(--accent2); }
  #status.err{ color:var(--danger); }
  .hint{ color:var(--muted); font-size:12px; text-align:center; max-width:260px; }
</style>

<body>

  <h1>Acceso MG Fitness Center</h1>
  <p class="sub">Mantené presionado 2 segundos para abrir</p>

  <div id="btn" class="btn">
    <div class="fill" id="fill"></div>
    <div class="label">
      <div class="icon">🔓</div>
      <span class="text" id="btnText">MANTENÉ<br>PRESIONADO</span>
    </div>
  </div>

  <div id="status">Listo</div>
  <p class="hint">Soltá antes de tiempo para cancelar.</p>

<script>
/* ============================================================
   CONFIGURACIÓN — completá estos dos valores
   ============================================================ */

// 1) URL pública del backend en Railway (SIN barra al final).
//    Railway → servicio backend → Settings → Networking → Public Domain.
const BACKEND_URL = "https://ai-mgfc-backend-production.up.railway.app/";

// 2) Secreto del endpoint. Por defecto es "mg_gym_sync_2026".
//    Si en Railway seteaste la variable GYM_SYNC_SECRET con otro valor, poné ESE acá.
const GYM_SECRET = "mg_gym_sync_2026";

const HOLD_MS = 2000; // duración del mantenido

/* ============================================================ */

const btn     = document.getElementById("btn");
const fill    = document.getElementById("fill");
const btnText = document.getElementById("btnText");
const status  = document.getElementById("status");

let rafId = null;
let startTs = 0;
let firing = false;   // evita disparos dobles
let holding = false;

function setStatus(msg, cls){
  status.textContent = msg;
  status.className = cls || "";
}

function startHold(){
  if(firing || holding) return;
  holding = true;
  btn.classList.remove("done","error");
  btn.classList.add("holding");
  btnText.innerHTML = "SEGUÍ<br>APRETANDO";
  setStatus("Manteniendo…");
  startTs = performance.now();
  tick();
}

function tick(){
  const elapsed = performance.now() - startTs;
  const pct = Math.min(100, (elapsed / HOLD_MS) * 100);
  fill.style.height = pct + "%";
  if(pct >= 100){
    holding = false;
    abrirPuerta();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function cancelHold(){
  if(!holding) return;
  holding = false;
  cancelAnimationFrame(rafId);
  fill.style.height = "0%";
  btn.classList.remove("holding");
  btnText.innerHTML = "MANTENÉ<br>PRESIONADO";
  setStatus("Cancelado", "");
}

async function abrirPuerta(){
  firing = true;
  cancelAnimationFrame(rafId);
  fill.style.height = "100%";
  btn.classList.remove("holding");
  btnText.innerHTML = "ABRIENDO…";
  setStatus("Enviando comando…");

  try{
    const base = BACKEND_URL.replace(/\/+$/, ""); // quita barra(s) final(es)
    const resp = await fetch(base + "/api/gym/abrir-puerta", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-gym-secret": GYM_SECRET
      },
      body: "{}"
    });
    const data = await resp.json().catch(()=>({}));

    if(resp.ok && data.success){
      btn.classList.add("done");
      btnText.innerHTML = "✓ ABIERTO";
      setStatus("Puerta abierta correctamente", "ok");
    } else if(resp.status === 401){
      throw new Error("Secreto incorrecto (401). Revisá GYM_SECRET.");
    } else {
      throw new Error(data.error || ("Error " + resp.status));
    }
  }catch(err){
    btn.classList.add("error");
    btnText.innerHTML = "✕ ERROR";
    let msg = err.message || "Fallo de conexión";
    if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
      msg = "No se pudo conectar. Revisá BACKEND_URL y tu internet.";
    }
    setStatus(msg, "err");
  }

  // Resetear a los 2,5s para permitir otra apertura
  setTimeout(()=>{
    firing = false;
    fill.style.height = "0%";
    btn.classList.remove("done","error","holding");
    btnText.innerHTML = "MANTENÉ<br>PRESIONADO";
    setStatus("Listo", "");
  }, 2500);
}

/* ---- Eventos: TOUCH (celu) + MOUSE (notebook) ---- */

// Touch — clave para que funcione en el celular.
btn.addEventListener("touchstart", (e)=>{ e.preventDefault(); startHold(); }, {passive:false});
btn.addEventListener("touchend",   (e)=>{ e.preventDefault(); cancelHold(); }, {passive:false});
btn.addEventListener("touchcancel",(e)=>{ e.preventDefault(); cancelHold(); }, {passive:false});

// Mouse — notebook / escritorio.
btn.addEventListener("mousedown", startHold);
btn.addEventListener("mouseup",   cancelHold);
btn.addEventListener("mouseleave",cancelHold);

// Bloquea el menú contextual del "mantener presionado" en móvil.
btn.addEventListener("contextmenu", (e)=> e.preventDefault());
</script>
</body>
</html>
